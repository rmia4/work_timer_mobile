# vX.Y.Z 태그를 올리면 서명된 release APK를 빌드해 GitHub Release에 붙인다.
# 이미 있는 태그는 Actions 탭에서 Run workflow로 태그 이름을 넣어 다시 만들 수 있다.
# 필요한 저장소 시크릿: KEYSTORE_BASE64(upload.jks를 base64로), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "APK를 만들 태그 (예: v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 시크릿이 없습니다"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: APK 빌드
        # v1.1.0까지의 태그는 gradlew에 실행 권한이 없다
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "work-timer-${TAG#v}.apk"

      - name: Release에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "work-timer-${TAG#v}.apk" --clobber
          else
            gh release create "$TAG" "work-timer-${TAG#v}.apk" --title "$TAG" --generate-notes
          fi
